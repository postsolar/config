# model = "gpt-5.4"
model_reasoning_effort = "medium"

approval_policy = "on-request"
sandbox_mode = "workspace-write"

show_raw_agent_reasoning = true
approvals_reviewer = "user"

[features]

[sandbox_read_only]
network_access = true

[sandbox_workspace_write]
